<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Что изменилось?</title>

<style>
:root{
    --blue:#1E3F8A;
    --orange:#FF6A00;
    --bg:#0f1b3d;
    --cell:#2c3e70;
    --coord:#182952;
    --text:white;
}

body.light{
    --bg:#f5f6fa;
    --cell:#dbe4ff;
    --coord:#c9d6ff;
    --text:#111;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* HEADER */
header{
    width:100%;
    background:var(--blue);
    padding:16px;
    text-align:center;
    font-size:22px;
    font-style:italic;
    font-weight:600;
    box-sizing:border-box;
}

/* PANEL */
#panel{
    margin-top:12px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    align-items:center;
}

/* SELECT */
select{
    padding:8px 10px;
    border-radius:8px;
    border:none;
    font-weight:bold;
    outline:none;
}

/* BUTTON */
button{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    background:var(--orange);
    color:white;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 0 #b84a00;
    transition:0.08s;
}

button:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #b84a00;
}

/* STATS */
#stats{
    margin-top:12px;
    font-size:14px;
    opacity:0.9;
}

/* FEEDBACK */
#feedback{
    margin-top:10px;
    font-size:18px;
    font-weight:bold;
    min-height:24px;
}

/* GAME */
#game{
    margin-top:20px;
    display:grid;
    gap:8px;
}

.cell,
.coord{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    box-sizing:border-box;
}

.cell{
    background:var(--cell);
    font-size:28px;
    cursor:pointer;
    transition:0.12s;
}

.cell:hover{
    transform:scale(1.03);
}

.coord{
    background:var(--coord);
    font-weight:bold;
    font-size:16px;
}

/* STATES */
.correct{
    background:var(--orange)!important;
}

.wrong{
    background:#e74c3c!important;
}

/* FOOTER SIGN */
#signature{
    position:fixed;
    bottom:6px;
    right:10px;
    font-size:11px;
    opacity:0.4;
    user-select:none;
}

/* MOBILE */
@media (max-width:600px){
    .cell,.coord{
        width:48px;
        height:48px;
        font-size:22px;
    }

    header{
        font-size:18px;
    }
}
</style>
</head>

<body>

<header>Что изменилось?</header>

<div id="panel">

📦
<select id="size">
    <option value="9">3×3</option>
    <option value="16" selected>4×4</option>
    <option value="25">5×5</option>
</select>

🔀
<select id="changes">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="8" selected>8</option>
</select>

⏱
<select id="speed">
    <option value="3200">Медленно</option>
    <option value="2500" selected>Средне</option>
    <option value="1700">Быстро</option>
</select>

⚙️
<select id="mode">
    <option value="auto" selected>Авто</option>
    <option value="manual">Ручной</option>
</select>

<label>
<input type="checkbox"
onchange="document.body.classList.toggle('light')">
☀️
</label>

<button onclick="startGame()">Старт</button>
<button onclick="showManual()">ДАЛЬШЕ</button>

</div>

<div id="stats">
Уровень: <span id="level">1</span> |
Очки: <span id="score">0</span> |
Найдено: <span id="found">0</span>/<span id="total">0</span>
</div>

<div id="feedback"></div>

<div id="game"></div>

<div id="signature">© verner</div>

<script>

const symbols = [
"🔵","🟡","🟢","🔺","⬛","⭐","🍎","⚪",
"🍌","🍇","🍒","🍉","🔥","⚡","🌙","☀️",
"🚗","🚀","🎯","🎲","🎈","🧩","🍭","🪁"
];

const letters = ["А","Б","В","Г","Д"];

let baseState=[];
let changedState=[];
let changedIndices=[];
let fakeIndices=[];

let showing=false;
let mode="auto";

let level=1;
let score=0;
let found=0;
let total=0;
let streak=0;

const game=document.getElementById("game");

function randomSymbol(){
    return symbols[Math.floor(Math.random()*symbols.length)];
}

function updateStats(){
    document.getElementById("level").textContent=level;
    document.getElementById("score").textContent=score;
    document.getElementById("found").textContent=found;
    document.getElementById("total").textContent=total;
}

function feedback(t){
    document.getElementById("feedback").textContent=t;
}

function createGrid(state,size){

    const side=Math.sqrt(size);

    game.innerHTML="";
    game.style.gridTemplateColumns=`repeat(${side+1},60px)`;

    const empty=document.createElement("div");
    empty.className="coord";
    empty.style.opacity="0";
    game.appendChild(empty);

    for(let c=0;c<side;c++){
        let top=document.createElement("div");
        top.className="coord";
        top.textContent=letters[c];
        game.appendChild(top);
    }

    for(let r=0;r<side;r++){

        let left=document.createElement("div");
        left.className="coord";
        left.textContent=r+1;
        game.appendChild(left);

        for(let c=0;c<side;c++){

            let i=r*side+c;

            let div=document.createElement("div");
            div.className="cell";
            div.textContent=state[i];

            div.onclick=()=>check(i,div);

            game.appendChild(div);
        }
    }

    /* ЛОЖНЫЕ СИГНАЛЫ — КАК В ТВОЁМ КОДЕ */
    setTimeout(()=>{
        document.querySelectorAll(".cell").forEach((el,i)=>{
            if(fakeIndices.includes(i)){
                el.style.filter="brightness(1.4)";
                el.style.transform="scale(1.05)";

                setTimeout(()=>{
                    el.style.filter="";
                    el.style.transform="";
                },220);
            }
        });
    },30);
}

function generate(){

    let size=+document.getElementById("size").value;
    let changeCount=+document.getElementById("changes").value;
    let speed=+document.getElementById("speed").value;

    mode=document.getElementById("mode").value;

    baseState=[];
    changedState=[];
    changedIndices=[];
    fakeIndices=[];

    found=0;
    total=changeCount;

    for(let i=0;i<size;i++){
        baseState.push(randomSymbol());
    }

    changedState=[...baseState];

    while(changedIndices.length<changeCount){
        let idx=Math.floor(Math.random()*size);

        if(!changedIndices.includes(idx)){
            changedIndices.push(idx);
        }
    }

    changedIndices.forEach(i=>{
        changedState[i]=randomSymbol();
    });

    /* ЛОЖНЫЕ СИГНАЛЫ — КАК БЫЛО */
    let fakeCount=Math.min(3,Math.floor(changeCount/2));

    while(fakeIndices.length<fakeCount){
        let idx=Math.floor(Math.random()*size);

        if(
            !changedIndices.includes(idx)
            &&
            !fakeIndices.includes(idx)
        ){
            fakeIndices.push(idx);
        }
    }

    showing=true;
    createGrid(baseState,size);

    if(mode==="auto"){

        setTimeout(()=>{
            showing=false;
            createGrid(changedState,size);
        },speed);

    }
}

function showManual(){

    if(mode!=="manual") return;
    if(!showing) return;

    showing=false;

    const size=
    +document.getElementById("size").value;

    createGrid(changedState,size);
}

function startGame(){
    level=1;
    score=0;
    streak=0;
    updateStats();
    next();
}

function next(){
    generate();
}

function check(i,el){

    if(showing)return;

    if(changedIndices.includes(i)){

        if(!el.classList.contains("correct")){
            el.classList.add("correct");
            found++;
            streak++;
            score+=10+(streak>=3?2:0);
            feedback("✅ верно");
        }

    }else if(fakeIndices.includes(i)){

        el.classList.add("wrong");
        streak=0;
        score-=2;
        feedback("⚠️ ложный сигнал");

    }else{

        el.classList.add("wrong");
        streak=0;
        score-=1;
        feedback("❌ нет");
    }

    updateStats();

    if(found>=total){
        level++;
        feedback("⚡ уровень пройден");
        setTimeout(next,800);
    }
}

</script>

</body>
</html>
