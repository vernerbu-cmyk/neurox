<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="stylesheet" href="../menu/menu.css">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Найди цифру</title>

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&family=Comfortaa:wght@300..700&family=Caveat:wght@400..700&family=Nunito:wght@200..900&family=Pacifico&family=Montserrat:wght@300..900&display=swap" rel="stylesheet">

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    display:flex;
    background:#0B1220;
    font-family:Montserrat,sans-serif;
}

/* PANEL */

#panel{
    width:220px;
    min-width:220px;
    background:#16233f;
    color:white;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:12px;
    box-sizing:border-box;
    transition:.25s;
    overflow:hidden;
    z-index:20;
}

#panel.closed{
    width:0;
    min-width:0;
    padding:0;
}

/* TOGGLE */

#toggleBtn{
    position:fixed;
    left:220px;
    top:12px;

    width:34px;
    height:34px;

    border:none;
    border-radius:10px;

    background:#FF6A00;
    color:white;

    font-size:18px;
    font-weight:900;

    cursor:pointer;

    z-index:50;

    transition:.25s;
}

#panel.closed + #toggleBtn{
    left:10px;
}

.box{
    background:rgba(255,255,255,0.08);
    border-radius:10px;
    padding:10px;
    font-weight:700;
}

button,select{
    border:none;
    border-radius:10px;
    padding:10px;
    font-family:inherit;
    font-weight:800;
    box-sizing:border-box;
}

button{
    background:#FF6A00;
    color:white;
    cursor:pointer;
}

button:active{
    transform:translateY(2px);
}

select{
    width:100%;
}

/* FIELD */

#wrap{
    flex:1;
    position:relative;
    overflow:hidden;
    background:#111827;
}

/* NUMBERS */

.num{
    position:absolute;
    transform:translate(-50%,-50%);
    user-select:none;
    cursor:pointer;
    pointer-events:auto;
    font-weight:800;
    will-change:transform,left,top;
}

/* CENTER */

#center{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:150px;
    font-weight:900;

    color:#FF6A00;

    opacity:0;

    pointer-events:none;

    transition:opacity .2s;

    z-index:100;
}

/* MOBILE */

@media (max-width:768px){

    body{
        flex-direction:column;
    }

    #panel{
        width:100%;
        min-width:auto;

        flex-direction:row;
        flex-wrap:wrap;
    }

    #panel.closed{
        height:0;
        min-height:0;
        width:100%;
    }

    #toggleBtn{
        left:auto;
        right:10px;
        top:10px;
    }

    .box{
        flex:1 1 45%;
    }

    button{
        flex:1 1 45%;
    }
}

</style>
</head>

<body>

<div id="panel">

    <div class="box" id="target">
        Найди: —
    </div>

    <div class="box" id="timer">
        0.000
    </div>

    <div class="box">

        Сложность

        <select id="diff">

            <option value="easy">
                easy
            </option>

            <option value="normal" selected>
                normal
            </option>

            <option value="hard">
                hard
            </option>

        </select>

    </div>

    <button id="pauseBtn">
        Пауза
    </button>

    <button id="restartBtn">
        Заново
    </button>

<button id="phoneBtn">📱 Телефон</button>

</div>

<button id="toggleBtn">
    ◀
</button>

<div id="wrap"></div>

<div id="center"></div>

<script>

const wrap = document.getElementById("wrap");

const targetEl =
    document.getElementById("target");

const timerEl =
    document.getElementById("timer");

const centerEl =
    document.getElementById("center");

const pauseBtn =
    document.getElementById("pauseBtn");

const restartBtn =
    document.getElementById("restartBtn");

const diffSelect =
    document.getElementById("diff");

const panel =
    document.getElementById("panel");

const toggleBtn =
    document.getElementById("toggleBtn");

const COUNT = 99;

const fonts = [
    "Unbounded",
    "Comfortaa",
    "Caveat",
    "Nunito",
    "Pacifico",
    "Montserrat"
];

const DIFF = {

    easy:{
        speed:0.7,
        size:1.25,
        force:0.8
    },

    normal:{
        speed:1.4,
        size:1,
        force:1.2
    },

    hard:{
        speed:2.2,
        size:0.75,
        force:1.8
    }
};

let difficulty = DIFF.normal;

let items = [];
let currentNumbers = [];

let target = 1;

let paused = false;

let mouseX = -9999;
let mouseY = -9999;
let phoneMode = false;
let pressed = false;

let start = performance.now();

/* HELPERS */

function rand(a,b){
    return Math.random()*(b-a)+a;
}

function pick(arr){
    return arr[
        Math.floor(Math.random()*arr.length)
    ];
}

/* TIMER */

setInterval(()=>{

    if(paused) return;

    timerEl.textContent =
        ((performance.now()-start)/1000)
        .toFixed(3);

},50);

/* POINTER */

wrap.addEventListener("pointermove",(e)=>{

    const rect =
        wrap.getBoundingClientRect();

    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

wrap.addEventListener("pointerdown",()=>{

    pressed = true;
});

window.addEventListener("pointerup",()=>{

    pressed = false;
});

/* PANEL */

toggleBtn.addEventListener("click",()=>{

    panel.classList.toggle("closed");

    const closed =
        panel.classList.contains("closed");

    toggleBtn.textContent =
        closed ? "▶" : "◀";
});

/* CENTER */

function showCenter(){

    centerEl.textContent = target;

    centerEl.style.opacity = 1;

    setTimeout(()=>{

        centerEl.style.opacity = 0;

    },400);
}

/* TARGET */

function setTarget(){

    target = currentNumbers[
        Math.floor(Math.random() * currentNumbers.length)
    ];

    targetEl.textContent =
        "Найди: " + target;

    showCenter();
}

/* BUILD */

function build(){

    wrap.innerHTML = "";

    items = [];

    const W = wrap.clientWidth;
    const H = wrap.clientHeight;

    const nums = phoneMode
    ? Array.from({length:99}, (_,i)=>i+1)
        .sort(()=>Math.random()-0.5)
        .slice(0,50)
    : Array.from({length:99}, (_,i)=>i+1)
        .sort(()=>Math.random()-0.5);

currentNumbers = [...nums];

    for(const n of nums){

        const el =
            document.createElement("div");

        el.className = "num";

        el.textContent = n;

        const baseSize =

            Math.random()<0.15 ? 84 :

            Math.random()<0.40 ? 58 :

            Math.random()<0.75 ? 38 : 24;

        const size =
    baseSize *
    difficulty.size *
    (phoneMode ? 0.65 : 1);

        el.style.fontSize =
            size + "px";

        el.style.fontFamily =
            pick(fonts);

        el.style.color =
            `hsl(${Math.random()*360},85%,65%)`;

        wrap.appendChild(el);

        const obj = {

            el,

            val:n,

            r:size*0.6,

            x:rand(size,W-size),
            y:rand(size,H-size),

            vx:rand(-2.8,2.8)
                * difficulty.speed,

            vy:rand(-2.8,2.8)
                * difficulty.speed,

            rot:rand(-35,35),

            skew:rand(-0.25,0.25)
        };

        el.addEventListener(
            "pointerdown",
            (e)=>{

                e.stopPropagation();

                if(obj.val !== target)
                    return;

                start =
                    performance.now();

                resetGame();
            }
        );

        items.push(obj);
    }

    setTarget();
}

/* RESET */

function resetGame(){

    const W = wrap.clientWidth;
    const H = wrap.clientHeight;

    for(const o of items){

        o.x = rand(o.r,W-o.r);
        o.y = rand(o.r,H-o.r);

        o.vx =
            rand(-2.8,2.8)
            * difficulty.speed;

        o.vy =
            rand(-2.8,2.8)
            * difficulty.speed;
    }

    setTarget();
}

/* PAUSE */

function togglePause(){

    paused = !paused;

    pauseBtn.textContent =
        paused
            ? "Продолжить"
            : "Пауза";
}

pauseBtn.addEventListener(
    "click",
    togglePause
);

const phoneBtn = document.getElementById("phoneBtn");

phoneBtn.addEventListener("click", ()=>{

    phoneMode = !phoneMode;

    phoneBtn.textContent =
        phoneMode ? "🖥 ПК режим" : "📱 Телефон";

    build();              // пересоздать цифры
    start = performance.now(); // обнулить таймер (по желанию)
});

restartBtn.addEventListener(
    "click",
    ()=>{

        start = performance.now();

        resetGame();
    }
);

diffSelect.addEventListener(
    "change",
    (e)=>{

        difficulty =
            DIFF[e.target.value];

        resetGame();
    }
);

/* ANIMATE */

function animate(){

    const W = wrap.clientWidth;
    const H = wrap.clientHeight;

    for(const o of items){

        if(!paused){

            o.x += o.vx;
            o.y += o.vy;

            /* LESS FRICTION */

            o.vx *= 0.999;
            o.vy *= 0.999;

            /* SPEED LIMIT */

            const MAX =
                8 * difficulty.speed;

            o.vx =
                Math.max(
                    -MAX,
                    Math.min(MAX,o.vx)
                );

            o.vy =
                Math.max(
                    -MAX,
                    Math.min(MAX,o.vy)
                );

            /* WALLS */

            if(o.x < o.r){

                o.x = o.r;
                o.vx *= -1;
            }

            if(o.x > W-o.r){

                o.x = W-o.r;
                o.vx *= -1;
            }

            if(o.y < o.r){

                o.y = o.r;
                o.vy *= -1;
            }

            if(o.y > H-o.r){

                o.y = H-o.r;
                o.vy *= -1;
            }

            /* AGGRESSIVE PUSH */

            if(pressed){

                const dx =
                    o.x - mouseX;

                const dy =
                    o.y - mouseY;

                const d =
                    Math.hypot(dx,dy);

                const radius = 240;

                if(d < radius && d > 0.01){

                    const power =

                        (1 - d/radius)

                        * 8

                        * difficulty.force;

                    /* velocity */

                    o.vx +=
                        (dx/d) * power;

                    o.vy +=
                        (dy/d) * power;

                    /* direct shove */

                    o.x +=
                        (dx/d)
                        * power
                        * 4;

                    o.y +=
                        (dy/d)
                        * power
                        * 4;
                }
            }
        }

        o.el.style.left =
            o.x + "px";

        o.el.style.top =
            o.y + "px";

        o.el.style.transform =

            `translate(-50%,-50%)

            rotate(${o.rot}deg)

            skew(${o.skew}deg,
            ${o.skew}deg)`;
    }

    requestAnimationFrame(animate);
}

/* START */

build();

animate();

</script>
<script src="../menu/menu.js"></script>
</body>
</html>
