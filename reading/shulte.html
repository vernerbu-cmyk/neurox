<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="stylesheet" href="../menu/menu.css">
<meta charset="UTF-8">
<title>Шульте</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
    --blue:#1E3F8A;
    --orange:#FF6A00;
    --bg:#f4f6fb;
}

*{ box-sizing:border-box; }

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    min-height:100vh;
}

/* TOP */
.topbar{
    background:var(--blue);
    color:white;
    text-align:center;
    padding:14px;
    font-style:italic;
    font-size:22px;
}

/* CENTER */
.container{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:700px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* CONTROLS */
.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:10px;
}

.checks{
    display:flex;
    gap:15px;
    margin-bottom:10px;
}

select, button{
    font-size:16px;
    padding:8px 12px;
    border-radius:10px;
}

button{
    background:var(--orange);
    color:white;
    border:none;
    box-shadow:0 4px 0 #c24f00;
    cursor:pointer;
}

button:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 #c24f00;
}

input[type="checkbox"]{
    accent-color:var(--orange);
}

/* BOARD */
#boardWrapper{
    position:relative;
    width:min(92vw,520px);
    transform-origin:center;
}

#board{
    display:grid;
    gap:8px;
    width:100%;
}

.cell{
    background:white;
    border:2px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    aspect-ratio:1/1;
    font-size:clamp(18px,3.5vw,42px);
}

/* FIXATION */
#fixation{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:80px;
    height:80px;
    pointer-events:none;
}

#star{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

#star svg{
    width:100%;
    height:100%;
    stroke:var(--orange);
    stroke-width:6;
    fill:none;
}

/* ⭐ ПУЛЬСАЦИЯ ЗВЕЗДЫ */
.pulse{
    animation:pulse 1.4s ease-in-out infinite;
}

@keyframes pulse{
    0%{
        transform:scale(0.9);
        opacity:0.5;
    }
    50%{
        transform:scale(1.15);
        opacity:1;
    }
    100%{
        transform:scale(0.9);
        opacity:0.5;
    }
}

/* FOOTER */
.signature{
    position:fixed;
    bottom:6px;
    right:10px;
    font-size:10px;
    color:#999;
}
</style>
</head>

<body>

<div class="topbar">Шульте</div>

<div class="container">
<div class="card">

    <div class="controls">

        <select id="size">
            <option value="3">3×3</option>
            <option value="4">4×4</option>
            <option value="5">5×5</option>
        </select>

        <select id="mode">
            <option value="numbers">Числа</option>
            <option value="letters">Буквы</option>
        </select>

        <button onclick="generate()">Старт</button>

    </div>

    <div class="checks">
        <label><input type="checkbox" id="mirror"> Зеркало</label>
        <label><input type="checkbox" id="flip"> Переворот</label>
    </div>

    <div id="boardWrapper">

        <div id="board"></div>

        <div id="fixation">
            <div id="star">
                <svg viewBox="0 0 100 100">
                    <polygon points="50,5 61,38 96,38 67,58 78,91 50,72 22,91 33,58 4,38 39,38"/>
                </svg>
            </div>
        </div>

    </div>

</div>
</div>

<div class="signature">© verner</div>

<script>

const alphabet=[
"А","Б","В","Г","Д","Е","Ё","Ж","З","И","Й","К","Л","М",
"Н","О","П","Р","С","Т","У","Ф","Х","Ц","Ч","Ш","Щ","Ъ",
"Ы","Ь","Э","Ю","Я"
];

function shuffle(a){
    const arr=[...a];
    for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
}

/* ✔ вращаем только таблицу */
function applyTransforms(){
    const boardWrapper=document.getElementById("boardWrapper");

    const mirror=document.getElementById("mirror").checked;
    const flip=document.getElementById("flip").checked;

    const sx = mirror ? -1 : 1;
    const sy = flip ? -1 : 1;

    boardWrapper.style.transform = `scale(${sx}, ${sy})`;
}

/* ⭐ управление звезды */
function setStarAnimation(){
    const star=document.getElementById("star");

    star.classList.remove("pulse");

    // всегда включаем пульсацию (можно потом усложнить режимами)
    star.classList.add("pulse");
}

document.getElementById("mirror").onchange = applyTransforms;
document.getElementById("flip").onchange = applyTransforms;

function generate(){

    const size=+document.getElementById("size").value;
    const mode=document.getElementById("mode").value;

    const board=document.getElementById("board");
    board.innerHTML="";
    board.style.gridTemplateColumns=`repeat(${size},1fr)`;

    const max=size*size;

    let items = mode==="numbers"
        ? Array.from({length:max},(_,i)=>i+1)
        : shuffle(alphabet).slice(0,max);

    items=shuffle(items);

    items.forEach(v=>{
        const d=document.createElement("div");
        d.className="cell";
        d.textContent=v;
        board.appendChild(d);
    });

    applyTransforms();
    setStarAnimation();
}

generate();

</script>

</body>
</html>
