<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Дошколятам - NeuroX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">


<style>

:root{
    --blue:#1E3F8A;
    --orange:#FF6A00;
    --bg:#F4F6FB;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    font-family:"Nunito Sans",sans-serif;
    background:var(--bg);
    color:#222;

}


/* HEADER */

header{

    background:var(--blue);
    color:white;

    padding:20px 24px;

    box-shadow:0 4px 12px rgba(0,0,0,.15);

}


.header-top{

    display:flex;

    align-items:center;
    justify-content:space-between;

}


.left-menu{

    display:flex;
    align-items:center;
    gap:15px;

}


.menu-btn{

    width:46px;
    height:46px;

    border:none;
    border-radius:14px;

    background:rgba(255,255,255,.15);

    color:white;

    font-size:24px;

    cursor:pointer;

}


.brand{

    display:flex;
    align-items:center;

    gap:12px;

}


.logo{

    font-size:42px;

}


h1{

    font-size:30px;
    font-weight:800;

}


.subtitle{

    font-size:14px;
    opacity:.9;

}


.header-buttons{

    display:flex;
    gap:10px;

}


.icon-btn{

    width:46px;
    height:46px;

    border:none;
    border-radius:14px;

    background:rgba(255,255,255,.15);

    color:white;

    font-size:22px;

    cursor:pointer;

}


.icon-btn:hover,
.menu-btn:hover{

    background:var(--orange);

}



/* CONTENT */


.container{

    max-width:700px;

    margin:auto;

    padding:35px 20px;

}


.section-title{

    color:var(--blue);

    font-size:32px;

    font-weight:800;

    margin-bottom:25px;

}



.card{

    background:white;

    border-radius:20px;

    margin-bottom:18px;

    padding:22px 24px;


    display:flex;

    align-items:center;

    justify-content:space-between;


    border-left:6px solid transparent;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

    cursor:pointer;

    transition:.18s;

}


.card:hover{

    transform:translateY(-3px);

    border-left-color:var(--orange);

}


.card:active{

    transform:scale(.985);

}


.left{

    display:flex;

    align-items:center;

    gap:18px;

}


.icon{

    font-size:34px;

}


.title{

    font-size:26px;

    font-weight:700;

    color:var(--blue);

}


.arrow{

    font-size:30px;

    color:#BBB;

}


/* FOOTER */


footer{

    text-align:center;

    color:#999;

    padding:20px;

    font-size:12px;

}



@media(max-width:700px){


h1{

    font-size:26px;

}


.logo{

    font-size:34px;

}


.title{

    font-size:22px;

}


.card{

    padding:18px;

}


}


</style>


</head>


<body>


<header>


<div class="header-top">


<div class="left-menu">


<button class="menu-btn" onclick="goBack()">
☰
</button>


<div class="brand">


<div class="logo">
🧠
</div>


<div>

<h1>NeuroX</h1>

<div class="subtitle">
Развитие когнитивных навыков
</div>

</div>


</div>


</div>



<div class="header-buttons">


<button class="icon-btn" onclick="showHelp()">
❔
</button>


<button class="icon-btn" onclick="showSettings()">
⚙
</button>


</div>


</div>


</header>




<div class="container">


<div class="section-title">
🧸 Дошколятам
</div>



<div class="card" onclick="openTrainer('letters')">

<div class="left">

<div class="icon">
🔤
</div>

<div class="title">
Буквы
</div>

</div>

<div class="arrow">
›
</div>

</div>




<div class="card" onclick="openTrainer('syllables')">

<div class="left">

<div class="icon">
📖
</div>

<div class="title">
Слоги
</div>

</div>

<div class="arrow">
›
</div>

</div>





<div class="card" onclick="openTrainer('attention')">

<div class="left">

<div class="icon">
👀
</div>

<div class="title">
Внимание
</div>

</div>

<div class="arrow">
›
</div>

</div>





<div class="card" onclick="openTrainer('memory')">

<div class="left">

<div class="icon">
🧠
</div>

<div class="title">
Память
</div>

</div>

<div class="arrow">
›
</div>

</div>





<div class="card" onclick="openTrainer('graphomotor')">

<div class="left">

<div class="icon">
✏️
</div>

<div class="title">
Графомоторика
</div>

</div>

<div class="arrow">
›
</div>

</div>



</div>




<footer>

© verner

</footer>




<script>


function goBack(){

    location.href="../index.html";

}



function openTrainer(name){

    console.log("Открыть:",name);

    // сюда потом подключим реальные тренажёры

}



function showHelp(){

    alert("Руководство пользователя\n\nПоявится позже 🙂");

}



function showSettings(){

    alert("Настройки\n\nПоявятся позже 🙂");

}



</script>


</body>
</html>
