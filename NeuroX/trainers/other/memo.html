<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMO тренажёр</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #f4f6fb, #e8edff);
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #1E3F8A;
}

.header {
    width: 100%;
    background: linear-gradient(135deg, #1E3F8A, #274db0);
    color: white;
    text-align: center;
    padding: 16px;
    font-size: 20px;
    font-weight: 700;
}

.start-screen {
    margin-top: 50px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
}

.big-btn {
    padding: 22px 46px;
    font-size: 22px;
    background: linear-gradient(135deg, #FF8C00, #ff6a00);
    color: white;
    border: none;
    border-radius: 18px;
    cursor: pointer;
}

.timer-bar {
    width: min(92vw, 720px);
    height: 10px;
    background: linear-gradient(90deg, #1E3F8A, #3b82f6);
    border-radius: 999px;
    margin: 14px 0;
    transition: width 1s linear;
}

/* ❗ СТАБИЛЬНАЯ СЕТКА */
.grid {
    display: grid;
    gap: 8px;
    width: min(92vw, 720px);
}

/* карточки фиксированные */
.card {
    aspect-ratio: 1 / 1;
    width: 100%;
    perspective: 900px;
    cursor: pointer;
}

.inner {
    width: 100%;
    height: 100%;
    transition: transform 0.55s ease;
    transform-style: preserve-3d;
    position: relative;
}

.card.flipped .inner {
    transform: rotateY(180deg);
}

.face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    backface-visibility: hidden;
}

.front {
    background: linear-gradient(145deg, #1E3F8A, #2a56c6);
    color: white;
    font-size: 18px;
    font-weight: 600;
}

.back {
    background: white;
    transform: rotateY(180deg);
    font-size: 42px;
    border: 1px solid rgba(30,63,138,0.2);
}
</style>
</head>

<body>

<div class="header">MEMO тренажёр памяти</div>

<div class="start-screen" id="startScreen">

    <label>Сетка:
        <select id="size">
            <option value="4">4×4</option>
            <option value="6">6×6</option>
            <option value="8">8×8</option>
        </select>
    </label>

    <label>Запоминание:
        <select id="preview">
            <option value="5">5 сек</option>
            <option value="8" selected>8 сек</option>
            <option value="12">12 сек</option>
            <option value="20">20 сек</option>
            <option value="60">60 сек</option>
        </select>
    </label>

    <button class="big-btn" onclick="startGame()">▶ НАЧАТЬ</button>
</div>

<div id="game" class="hidden">
    <div class="timer-bar" id="timerBar"></div>
    <div class="grid" id="grid"></div>
</div>

<script>

const icons=[
"🍎","🚗","🐶","⚽","🌙","🎲","🎧","🔥",
"🐱","🐸","🦊","🐼","🍕","🍉","🚀","🎈",
"🏀","🎮","📚","✏️","🎯","🧠","⚡","🌈",
"🐝","🦁","🐙","🍩","🧩","🚁","🏆","💡"
];

let cards=[], first=null, lock=false;
let pairs=0, moves=0;

function shuffle(a){
    for(let i=a.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
}

/* 🔥 ФИКС-таймер */
function runTimer(sec, onEnd){
    const bar=document.getElementById("timerBar");
    let t=sec;

    bar.style.width="100%";

    const interval=setInterval(()=>{
        t--;
        bar.style.width=(t/sec)*100+"%";

        if(t<=0){
            clearInterval(interval);
            bar.style.width="0%";
            if(onEnd) onEnd();
        }
    },1000);
}

/* START */
function startGame(){

    const size=+document.getElementById("size").value;
    const preview=+document.getElementById("preview").value;

    const total=size*size;
    const need=total/2;

    const pool=[...icons];
    const pick=[];

    for(let i=0;i<need;i++){
        const idx=Math.floor(Math.random()*pool.length);
        pick.push(pool.splice(idx,1)[0]);
    }

    cards=shuffle([...pick,...pick]);

    const grid=document.getElementById("grid");
    grid.innerHTML="";
    grid.style.gridTemplateColumns=`repeat(${size},1fr)`;

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    lock=true;
    first=null;
    pairs=0;
    moves=0;

    cards.forEach((ic,i)=>{
        const c=document.createElement("div");
        c.className="card flipped";
        c.dataset.icon=ic;

        c.innerHTML=`
        <div class="inner">
            <div class="face front">${i+1}</div>
            <div class="face back">${ic}</div>
        </div>`;

        c.onclick=()=>flip(c);
        grid.appendChild(c);
    });

    runTimer(preview, ()=>{

        document.querySelectorAll(".card").forEach(c=>{
            c.classList.remove("flipped");
        });

        lock=false;
    });
}

/* FLIP */
function flip(card){

    if(lock || card.classList.contains("flipped")) return;

    card.classList.add("flipped");

    if(!first){
        first=card;
        return;
    }

    moves++;
    lock=true;

    if(first.dataset.icon===card.dataset.icon){

        const a=first;
        const b=card;

        setTimeout(()=>{
            a.classList.add("matching");
            b.classList.add("matching");
        },120);

        setTimeout(()=>{

            /* ❗ ВАЖНО: НЕ УДАЛЯЕМ, только скрываем */
            a.style.visibility="hidden";
            b.style.visibility="hidden";

            pairs++;
            first=null;
            lock=false;

        },900);

    } else {

        setTimeout(()=>{
            first.classList.remove("flipped");
            card.classList.remove("flipped");
            first=null;
            lock=false;
        },700);
    }
}

</script>

</body>
</html>
