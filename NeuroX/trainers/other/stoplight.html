<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Светофор</title>

<style>
:root{
  --blue:#1E3F8A;
  --orange:#FF6A00;
  --bg:#F5F7FB;
  --text:#24324B;
  --shadow:0 4px 0 rgba(180,80,0,.95);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  overflow:hidden;
  color:var(--text);
}

/* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */

.topbar{
  height:72px;
  background:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.title{
  color:#fff;
  font-size:32px;
  font-style:italic;
  font-weight:700;
  letter-spacing:.5px;
  user-select:none;
}

/* ===== ОСНОВНОЙ ЭКРАН ===== */

#app{
  height:calc(100vh - 72px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* СТИМУЛ */

#stimulus{
  font-size:clamp(58px, 10vw, 110px);
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10px;
  line-height:1.3;
  word-break:break-word;
}

/* ===== ПАНЕЛЬ ===== */

#panel{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:10px;
}

/* КНОПКИ */

button{
  border:none;
  border-radius:14px;
  background:var(--orange);
  color:#fff;
  font-size:15px;
  font-weight:700;
  padding:12px 18px;
  cursor:pointer;

  box-shadow:var(--shadow);
  transition:.08s ease;
}

button:active{
  transform:translateY(4px);
  box-shadow:none;
}

/* SELECT */

select{
  border:2px solid var(--orange);
  border-radius:12px;
  padding:10px 14px;
  font-size:15px;
  background:white;
  color:var(--text);
  outline:none;
}

select:focus{
  border-color:var(--orange);
}

/* ===== ПРАВИЛА ===== */

#legend{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  background:#fff;
  border-top:1px solid #dfe6f3;

  padding:12px 14px;
  box-shadow:0 -2px 10px rgba(0,0,0,.06);
}

.legend-row{
  display:flex;
  justify-content:center;
  gap:26px;
  flex-wrap:wrap;
}

.rule{
  font-size:24px;
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
}

.rule span{
  font-size:15px;
  color:#4c5c78;
}

/* ===== ПОДПИСЬ ===== */

.signature{
  position:fixed;
  right:10px;
  bottom:8px;
  font-size:11px;
  color:#9aa7bf;
  pointer-events:none;
  user-select:none;
}

/* ===== МОБИЛЬНАЯ АДАПТАЦИЯ ===== */

@media (max-width:700px){

  .topbar{
    height:64px;
  }

  .title{
    font-size:28px;
  }

  #app{
    height:calc(100vh - 64px);
    padding:14px;
    padding-bottom:120px;
  }

  #stimulus{
    font-size:clamp(50px, 12vw, 90px);
    min-height:120px;
  }

  button{
    font-size:14px;
    padding:11px 15px;
  }

  .rule{
    font-size:22px;
  }

  .rule span{
    font-size:14px;
  }
}
</style>
</head>

<body>

<!-- ВЕРХ -->
<div class="topbar">
  <div class="title">Светофор</div>
</div>

<!-- ОСНОВА -->
<div id="app">

  <div id="stimulus">▶</div>

  <div id="panel">

    <button onclick="start()">Старт</button>

    <button onclick="stop()">Стоп</button>

    <select id="speed" onchange="setSpeed()">
      <option value="7000">7 сек</option>
      <option value="6000">6 сек</option>
      <option value="5000">5 сек</option>
      <option value="4000">4 сек</option>
      <option value="3000" selected>3 сек</option>
    </select>

    <button onclick="next()">▶ Следующий</button>

  </div>

</div>

<!-- ПРАВИЛА -->
<div id="legend">

  <div class="legend-row">
    <div class="rule">🐸 <span>считать</span></div>
    <div class="rule">🦊 <span>цвет</span></div>
    <div class="rule">🐻 <span>предмет</span></div>
  </div>

  <div class="legend-row" style="margin-top:8px;">
  <div class="rule">🟢 <span>отвечаем</span></div>
  <div class="rule">🟡 <span>шёпотом</span></div>
  <div class="rule">🔴 <span>молчим</span></div>
</div>

</div>

<div class="signature">© verner</div>

<script>

/* ===== СОСТОЯНИЕ ===== */

let running = false;
let timer = null;
let interval = 3000;

/* ===== ПРАВИЛА ===== */

const rules = ["🐸","🦊","🐻"];

/* ===== ЭМОДЗИ ===== */

const items = [

"🍎","🍏","🍌","🍇","🍓","🍒","🍊","🍋","🥕","🍉","🥝",

"🚗","🚙","🚌","🚲","✈️","🚀","🚜",

"🐶","🐱","🐸","🦊","🐯","🦉","🐺",

"🐛","🐜","🕷️","🪰",

"⚽","🏀","🎾",

"🌹","🌷","🌻","🌼",

"☀️","🌧️","⛅","❄️","⚡",

"⭐","🌙","💧"

];

/* ===== 90% / 10% ===== */

function getSignal(){

  const r = Math.random();

  if(r < 0.7){
    return "🟢"; // 70%
  }

  if(r < 0.9){
    return "🟡"; // 20%
  }

  return "🔴"; // 10%
}

function rand(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

/* ===== СБОРКА СТИМУЛА ===== */

function buildStimulus(){

  let signal = getSignal();
  let rule = rand(rules);
  let item = rand(items);

  let count = Math.floor(Math.random()*3)+1;

  let content = item.repeat(count);

  return `${signal} ${rule} ${content}`;
}

/* ===== ПОКАЗ ===== */

function show(){
  document.getElementById("stimulus").textContent =
    buildStimulus();
}

/* ===== СТАРТ ===== */

function start(){

  if(running) return;

  running = true;

  show();
  loop();
}

function loop(){

  if(!running) return;

  timer = setTimeout(() => {
    show();
    loop();
  }, interval);
}

/* ===== СТОП ===== */

function stop(){
  running = false;
  clearTimeout(timer);
}

/* ===== СЛЕДУЮЩИЙ ===== */

function next(){
  show();
}

/* ===== СКОРОСТЬ ===== */

function setSpeed(){

  interval =
    parseInt(document.getElementById("speed").value);

  if(running){
    stop();
    start();
  }
}

</script>

</body>
</html>
